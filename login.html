<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | IT Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060f1f;
  --card: rgba(30, 41, 59, 0.75);
  --border: rgba(56, 189, 248, 0.25);
  --border-light: rgba(148, 163, 184, 0.15);
  --text: #e8eef7;
  --muted: #a4b3c7;
  --accent: #38bdf8;
  --accent-dark: #0ea5e9;
  --glow: rgba(56, 189, 248, 0.3);
  --danger: #f87171;
  --success: #4ade80;
  --font: 'IBM Plex Sans Arabic', sans-serif;
  --head: 'Cairo', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08), transparent 40%);
}
.card {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.2rem 2rem;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.head { text-align: center; margin-bottom: 1.75rem; }
.logo {
  width: 60px; height: 60px;
  margin: 0 auto 1rem;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border-radius: 16px;
  font-family: var(--head);
  font-size: 1.5rem;
  font-weight: 900;
  color: #0a192f;
  box-shadow: 0 0 30px var(--glow);
}
.head h1 {
  font-family: var(--head);
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 0.4rem;
}
.head p { font-size: 0.88rem; color: var(--muted); }
.tabs {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1.5rem;
  background: rgba(15, 23, 42, 0.5);
  border-radius: 12px;
  padding: 0.35rem;
}
.tab {
  flex: 1;
  padding: 0.65rem 1rem;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--muted);
  font-family: var(--font);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
}
.tab.active {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: #0a192f;
}
.field { margin-bottom: 1.1rem; }
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.field input {
  width: 100%;
  padding: 0.85rem 1rem;
  background: rgba(15, 23, 42, 0.6);
  border: 1.5px solid var(--border-light);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  transition: all 0.2s ease;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(15, 23, 42, 0.9);
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
}
.field input::placeholder { color: rgba(148, 163, 184, 0.5); }
.btn {
  width: 100%;
  padding: 0.95rem 1rem;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  border: none;
  border-radius: 10px;
  color: #0a192f;
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s ease;
  margin-top: 0.5rem;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px var(--glow);
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn .spin {
  display: none;
  width: 14px; height: 14px;
  border: 2px solid rgba(10, 25, 47, 0.3);
  border-top-color: #0a192f;
  border-radius: 50%;
  animation: sp 0.7s linear infinite;
  margin-left: 0.5rem;
  vertical-align: middle;
}
.btn.loading .spin { display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
.msg {
  padding: 0.85rem 1rem;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 1.1rem;
  display: none;
}
.msg.show { display: block; }
.msg.err {
  background: rgba(248, 113, 113, 0.12);
  border: 1px solid rgba(248, 113, 113, 0.3);
  border-right: 4px solid var(--danger);
  color: #fca5a5;
}
.msg.ok {
  background: rgba(74, 222, 128, 0.12);
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-right: 4px solid var(--success);
  color: #86efac;
}
.foot {
  text-align: center;
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px dashed var(--border-light);
  font-size: 0.82rem;
  color: var(--muted);
}
.foot a { color: var(--accent); text-decoration: none; font-weight: 700; }
.badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  margin-top: 1.25rem;
  padding: 0.65rem 1rem;
  background: rgba(74, 222, 128, 0.08);
  border: 1px solid rgba(74, 222, 128, 0.2);
  border-radius: 50px;
  font-size: 0.75rem;
  color: var(--success);
  font-weight: 700;
}
@media (max-width: 480px) {
  .card { padding: 1.75rem 1.5rem; }
  .head h1 { font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo">IT</div>
    <h1>IT Academy</h1>
    <p>سجّل دخولك للوصول إلى العرض التدريبي</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLogin">تسجيل الدخول</button>
    <button class="tab" id="tabRegister">إنشاء حساب</button>
  </div>

  <div class="msg" id="msg"></div>

  <form id="form">
    <div class="field" id="nameField" style="display:none;">
      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" placeholder="مثال: أحمد محمد" autocomplete="name">
    </div>

    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
    </div>

    <button type="submit" class="btn" id="btn">
      <span id="btnText">تسجيل الدخول</span>
      <span class="spin"></span>
    </button>
  </form>


  <div class="badge">🔒 اتصال آمن ومشفّر بالكامل</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPAGjIg6uB8cNhnYPZaiUTlNC0AujxgbE",
  authDomain: "it-academy-bfd5f.firebaseapp.com",
  projectId: "it-academy-bfd5f",
  storageBucket: "it-academy-bfd5f.firebasestorage.app",
  messagingSenderId: "541610114198",
  appId: "1:541610114198:web:f8e5ad630558d6dfbc56b7",
  measurementId: "G-PXN778ZJP4"
};

  const WEB3FORMS_KEY = "76d3c19c-9d40-4c56-8248-5b876da73a62";

  const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* تفعيل التخزين المحلي — ليبقى المستخدم مسجّلاً بعد الانتقال بين الصفحات */
import { setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
await setPersistence(auth, browserLocalPersistence);

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const nameField = document.getElementById('nameField');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const btnText = document.getElementById('btnText');
  const msg = document.getElementById('msg');

  let mode = 'login';

  function setMode(newMode) {
    mode = newMode;
    tabLogin.classList.toggle('active', mode === 'login');
    tabRegister.classList.toggle('active', mode === 'register');
    nameField.style.display = mode === 'register' ? 'block' : 'none';
    nameInput.required = mode === 'register';
    btnText.textContent = mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
    passwordInput.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    hideMsg();
  }

  tabLogin.addEventListener('click', () => setMode('login'));
  tabRegister.addEventListener('click', () => setMode('register'));

  function showMsg(text, type = 'err') {
    msg.textContent = text;
    msg.className = `msg show ${type}`;
  }

  function hideMsg() {
    msg.className = 'msg';
  }

  function setLoading(loading) {
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
    btnText.textContent = loading
      ? 'جارٍ المعالجة...'
      : (mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب');
  }

  async function sendNotification(name, email) {
    const now = new Date();
    const timeStr = now.toLocaleString('ar-JO', {
      dateStyle: 'full',
      timeStyle: 'short',
      timeZone: 'Asia/Amman'
    });

    try {
      const response = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject: `🔔 تسجيل دخول جديد — ${name}`,
          from_name: 'IT Academy',
          name: name,
          email: email,
          login_time: timeStr,
          device: navigator.userAgent,
          message: `تم تسجيل دخول جديد:\n\nالاسم: ${name}\nالبريد: ${email}\nالوقت: ${timeStr}\nالجهاز: ${navigator.userAgent}`
        })
      });
      const data = await response.json();
      if (data.success) console.log('✅ تم إرسال الإشعار');
      else console.error('❌ فشل:', data);
    } catch (err) {
      console.error('❌ خطأ شبكة:', err);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const name = nameInput.value.trim();

    if (!email || !password) { showMsg('الرجاء إدخال البريد وكلمة المرور'); return; }
    if (mode === 'register' && !name) { showMsg('الرجاء إدخال الاسم الكامل'); return; }
    if (password.length < 6) { showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل'); return; }

    setLoading(true);

    try {
      if (mode === 'register') {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        showMsg(`✓ أهلاً ${name}! جارٍ توجيهك...`, 'ok');
        await sendNotification(name, email);
        setTimeout(() => window.location.href = 'index.html', 1500);
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const displayName = cred.user.displayName || 'مستخدم';
        showMsg(`✓ أهلاً ${displayName}! جارٍ توجيهك...`, 'ok');
        await sendNotification(displayName, email);
        setTimeout(() => window.location.href = 'index.html', 1200);
      }
    } catch (error) {
      console.error(error);
      const errorMap = {
        'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
        'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
        'auth/wrong-password': 'البريد أو كلمة المرور غير صحيحة',
        'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة',
        'auth/email-already-in-use': 'هذا البريد مُسجَّل مسبقاً — جرّب تسجيل الدخول',
        'auth/weak-password': 'كلمة المرور ضعيفة جداً',
        'auth/too-many-requests': 'محاولات كثيرة — حاول لاحقاً',
        'auth/network-request-failed': 'تحقق من اتصالك بالإنترنت'
      };
      showMsg(errorMap[error.code] || 'حدث خطأ غير متوقع');
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
